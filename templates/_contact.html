<!-- ============ CONTACT (shared) ============ -->
<section class="contact wrap" id="contact">
  <div class="cue reveal" style="justify-content:center"><span class="n">{{ contact_cue_no | default('00:06') }}</span> — {{ CONTACT.cue }}</div>
  <p class="big reveal">{{ CONTACT.big }}</p>

  <a class="email-cta reveal" href="mailto:{{ SITE.email }}">
    <span class="email-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M3 7l9 6 9-6"></path>
      </svg>
    </span>
    <span class="email-label">Email</span>
    <span class="email-addr">{{ SITE.email }}</span>
  </a>

  <div class="socials reveal">
    {% for s in SOCIALS %}<a href="{{ s.href }}" target="_blank" rel="noopener">{{ s.label }}</a>{% endfor %}
  </div>
</section>
