<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}{{ SITE.name }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ SITE.meta_description }}{% endblock %}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}" />
</head>
<body class="bg-ink text-paper font-body font-normal text-step-0 leading-[1.65] overflow-x-hidden">

<div class="grain"></div>
<div class="glow"></div>
<div class="vignette"></div>

<header class="site-nav" id="nav">
  <a class="mark" href="{{ url_for('index') }}">AMIT <b>DAS</b></a>
  <nav>
    {% for item in NAV %}<a href="{{ item.href }}">{{ item.label }}</a>{% endfor %}
  </nav>
</header>

{% block content %}{% endblock %}

<footer class="site-footer">
  <span>{{ SITE.copyright }}</span>
  <span>{{ SITE.footer_role }}</span>
  <span>Fin.</span>
</footer>

<script>
  // Thumbnail fallback: YouTube maxres 404s on some videos — retry hqdefault,
  // then hide the <img> so the card's graded gradient shows through.
  function thumbFallback(img){
    if(img.dataset.yt && !img.dataset.tried){
      img.dataset.tried = '1';
      img.src = 'https://img.youtube.com/vi/' + img.dataset.yt + '/hqdefault.jpg';
    } else {
      img.classList.add('thumb-failed');
    }
  }

  // sticky nav state
  var nav = document.getElementById('nav');
  var onScroll = function(){ nav.classList.toggle('solid', window.scrollY > 40); };
  onScroll(); window.addEventListener('scroll', onScroll, { passive:true });

  // scroll reveals
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold:0.12, rootMargin:'0px 0px -8% 0px' });
  document.querySelectorAll('.reveal').forEach(function(el, i){
    // gentle stagger for hero children
    if(el.closest('.hero')) el.style.transitionDelay = (i*0.09)+'s';
    io.observe(el);
  });

  // Hero auto-montage: crossfade the work stills behind the type. Static on
  // reduced-motion; silently absent if no frames rendered.
  (function(){
    var frames = [].slice.call(document.querySelectorAll('#hero-montage .montage-frame'));
    if(frames.length < 2) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var i = 0;
    setInterval(function(){
      frames[i].classList.remove('on');
      i = (i + 1) % frames.length;
      frames[i].classList.add('on');
    }, 5200);
  })();

  // Share button: native share on mobile, else copy the absolute link.
  function copyShareLink(btn){
    var path = btn.getAttribute('data-path') || location.pathname;
    var url = location.origin + path;
    var done = function(){
      var label = btn.querySelector('.share-label');
      if(!label) return;
      var prev = label.textContent;
      label.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(function(){ label.textContent = prev; btn.classList.remove('copied'); }, 1600);
    };
    if(navigator.share && matchMedia('(max-width: 720px)').matches){
      navigator.share({ url: url, title: document.title }).then(done).catch(function(){});
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ fallbackCopy(url, done); });
    } else {
      fallbackCopy(url, done);
    }
  }
  function fallbackCopy(text, done){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); done();
    }catch(e){}
  }

  // Work filter bar + shareable deep-links (#fashion or ?focus=ai) — home only
  (function(){
    var bar = document.getElementById('filter-bar');
    if(!bar) return;
    var chips = [].slice.call(bar.querySelectorAll('.chip'));
    var cards = [].slice.call(document.querySelectorAll('.work-card'));
    var cats  = [].slice.call(document.querySelectorAll('.work-cat'));
    var valid = chips.map(function(c){ return c.dataset.filter; });
    function apply(filter){
      if(valid.indexOf(filter) < 0) filter = 'all';
      chips.forEach(function(c){ c.classList.toggle('active', c.dataset.filter === filter); });
      cards.forEach(function(card){
        var show = filter === 'all' ||
          (' ' + (card.dataset.tags || '') + ' ').indexOf(' ' + filter + ' ') > -1;
        card.classList.toggle('is-hidden', !show);
      });
      cats.forEach(function(sec){
        sec.classList.toggle('is-hidden', !sec.querySelector('.work-card:not(.is-hidden)'));
      });
    }
    function fromUrl(){
      var hash = (location.hash || '').replace('#', '');
      var focus = new URLSearchParams(location.search).get('focus');
      apply(focus || hash || 'all');
    }
    chips.forEach(function(c){
      c.addEventListener('click', function(){
        var f = c.dataset.filter;
        apply(f);
        if(history.replaceState){
          history.replaceState(null, '', f === 'all' ? location.pathname : '#' + f);
        }
      });
    });
    window.addEventListener('hashchange', fromUrl);
    fromUrl();
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
